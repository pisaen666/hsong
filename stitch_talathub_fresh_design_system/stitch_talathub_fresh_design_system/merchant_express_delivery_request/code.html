<body class="bg-background text-on-background antialiased min-h-screen pb-safe">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-md shadow-sm border-b border-white/50 dark:border-outline-variant/20 transition-all duration-200">
<div class="flex items-center justify-between px-container-margin h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-sm">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-primary-container/10 transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 -translate-x-1/2 whitespace-nowrap">แผงค้าเรียกไรเดอร์ส่งของด่วน</h1>
<div class="flex items-center gap-sm w-10">
<!-- Placeholder for symmetry -->
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-container-margin pb-32 max-w-md mx-auto flex flex-col gap-lg">
<!-- Vendor Info (Readonly) -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-md flex items-center gap-md border border-surface-variant/50 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary shrink-0 z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<div class="flex flex-col z-10">
<label class="font-label-sm text-label-sm text-outline mb-xs">ข้อมูลผู้ส่ง</label>
<div class="font-body-md text-body-md text-on-surface font-medium">แผงผลไม้เจ๊อ้อย - ล็อค D05</div>
</div>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-md">
<!-- Item Details -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="item-details">ประเภทสินค้า</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">inventory_2</span>
<input class="w-full h-12 bg-surface-container-lowest border border-surface-variant rounded-lg pl-12 pr-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all shadow-sm" id="item-details" type="text" value="ผลไม้สด 2 ถุงใหญ่ (ประมาณ 4 กก.)"/>
</div>
</div>
<!-- Recipient Info -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="recipient-info">ชื่อและเบอร์โทรผู้รับปลายทาง</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">person_pin</span>
<input class="w-full h-12 bg-surface-container-lowest border border-surface-variant rounded-lg pl-12 pr-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all shadow-sm" id="recipient-info" type="text" value="คุณอรพิน 081-xxx-xxxx"/>
</div>
</div>
</section>
<!-- Delivery Location (Map Card) -->
<section class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">สถานที่จัดส่ง</label>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-surface-variant/50 overflow-hidden flex flex-col">
<!-- Mini Map Area -->
<div class="h-32 w-full bg-surface-variant relative overflow-hidden group">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="A modern, high-contrast digital map interface showing urban street grids. The map uses a very light color scheme with soft grey and pale green accents, reflecting a high-end mobile application aesthetic. The lighting is bright and flat, emphasizing usability and clarity in a light-mode UI context." data-location="Bangkok" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIrvQoYCFUCfbnTX_ecJYu-SmoF1Z1v_-2lKXQ1DhaP9ONlgaxOf7S4GbewEDSRex28L19oNvFCXF4Ac7Zd1Y0PJx9gt7s_pdyV3KH6gKyEG8Qy5EccI5pzUGpmhhLgeYsB0XPJSd14ZvCyrbGPJFh7uMfHhgin-5T5vW1fWZbs_KyfXOc6-gJcKa9f93mpevgSxUUEtwkyX8eJbefYXfARhXc-oFqU9UMc2yYKzozKgVcxQtIKSk4"/>
<!-- Pin -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-full text-secondary drop-shadow-md animate-bounce">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 to-transparent"></div>
</div>
<!-- Actions -->
<div class="p-md flex flex-col gap-sm bg-surface-container-lowest relative z-10 -mt-md rounded-t-xl">
<button class="w-full h-12 rounded-lg bg-surface-container flex items-center justify-center gap-sm font-label-md text-label-md text-primary hover:bg-primary/5 transition-colors active:scale-[0.98] border border-primary/20">
<span class="material-symbols-outlined">my_location</span>
                        ปักหมุดปลายทางส่งของ
                    </button>
<button class="w-full h-10 rounded-lg flex items-center justify-center gap-sm font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-sm">bookmarks</span>
                        เลือกสถานที่ที่บันทึกไว้
                    </button>
</div>
</div>
</section>
<!-- COD Settings -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-md border border-surface-variant/50 flex flex-col gap-md">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div>
<div class="font-body-md text-body-md text-on-surface font-medium">เก็บเงินปลายทาง (COD)</div>
<div class="font-label-sm text-label-sm text-outline">ให้ไรเดอร์เก็บเงินจากลูกค้า</div>
</div>
</div>
<!-- Toggle Switch (ON) -->
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary" role="switch" type="button">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
<!-- Conditional Input (Visible when ON) -->
<div class="pt-sm border-t border-surface-variant/50 flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="cod-amount">ระบุยอดที่ให้ไรเดอร์ช่วยเก็บให้</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-headline-md text-headline-md text-on-surface font-bold">฿</span>
<input class="w-full h-14 bg-background border border-surface-variant rounded-lg pl-12 pr-md font-headline-md text-headline-md text-on-surface font-bold focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all text-right shadow-inner" id="cod-amount" type="text" value="350"/>
</div>
</div>
</section>
<!-- Summary Highlights -->
<section class="bg-primary/5 rounded-lg p-md border border-primary/20 flex items-center justify-between gap-md">
<div class="flex items-center gap-sm text-primary">
<span class="material-symbols-outlined">two_wheeler</span>
<span class="font-body-md text-body-md font-medium">ค่าส่ง</span>
</div>
<div class="text-right">
<div class="font-headline-md text-headline-md text-primary font-bold">30 บาท</div>
<div class="font-label-sm text-label-sm text-primary/70">(หักจากยอด COD หรือ จ่ายสด)</div>
</div>
</section>
</main>
<!-- Fixed Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-xl border-t border-surface-variant/50 p-container-margin pb-safe z-40 shadow-[0px_-10px_30px_rgba(15,23,42,0.05)]">
<div class="max-w-md mx-auto">
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-headline-md text-headline-md font-bold shadow-lg hover:bg-primary/90 hover:shadow-xl transition-all active:scale-[0.98] flex items-center justify-center gap-sm overflow-hidden relative group">
<span class="relative z-10 flex items-center gap-xs">
                    เรียกไรเดอร์มารับของที่แผงทันที 
                    <span class="text-xl">🚀</span>
</span>
<!-- Glossy highlight effect -->
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/20 to-transparent"></div>
</button>
</div>
</div>
</body></html>
